<div class="dialog-form">
  <h2>Catégories de secrets</h2>
  <table class="queue-table">
    <thead><tr><th>Libellé</th><th>Identifiant</th><th class="num">Secrets</th><th></th></tr></thead>
    <tbody>
    {% for c in categories %}
      <tr>
        <td>
          <form method="post" action="/secrets/categories/{{ c.id }}/label" class="inline-edit">
            <input name="label" value="{{ c.label }}" maxlength="100" required aria-label="Libellé de {{ c.slug }}">
            <button type="submit" class="link">Renommer</button>
          </form>
        </td>
        <td><code class="small">{{ c.slug }}</code></td>
        <td class="num">{{ c.secret_count }}</td>
        <td>{% if c.secret_count == 0 %}
          <form method="post" action="/secrets/categories/{{ c.id }}/delete" class="inline">
            <button type="submit" class="link-danger">Supprimer</button></form>
        {% else %}<span class="muted small">non vide</span>{% endif %}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <h3>Nouvelle catégorie</h3>
  <form method="post" action="/secrets/categories" class="form-row">
    <input name="label" maxlength="100" required placeholder="Libellé (Transporteurs)" aria-label="Libellé">
    <input name="slug" maxlength="40" required pattern="[a-z][a-z0-9_]*" placeholder="identifiant (transport)" aria-label="Identifiant">
    <button type="submit">Créer</button>
  </form>
  <p class="hint">L'identifiant entre dans les références (<code>transport/…</code>) : il ne change plus après création.</p>
  <div class="dialog-actions">
    <button type="button" class="secondary" onclick="this.closest('dialog').close()">Fermer</button>
  </div>
</div>
